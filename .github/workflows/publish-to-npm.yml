name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags created by create-release workflow
  workflow_dispatch:  # Allow manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 (LTS); the npm releases below no longer support Node 20
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          
      # npm 11.5.1+ is needed for trusted publishing (OIDC). Pinned to a major so a
      # new npm release can't break publishing (npm 12 dropped Node 20 overnight).
      - name: Update npm
        run: npm install -g npm@11
        
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Run tests (if any)
        run: npm test --if-present
          
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}